services:
  mysql:
    image: mysql:8.4
    container_name: glxt-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-glxt}
      MYSQL_USER: ${MYSQL_USER:-glxt}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-glxt123456}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./glxt
      dockerfile: Dockerfile
    container_name: glxt-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      EnableSwagger: "true"
      DisableHttpsRedirection: "true"
      ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-glxt};User Id=${MYSQL_USER:-glxt};Password=${MYSQL_PASSWORD:-glxt123456};
      JwtSettings__Secret: ${JWT_SECRET:-replace-with-a-32-character-secret-key}
      JwtSettings__Issuer: ${JWT_ISSUER:-glxt-api}
      JwtSettings__Audience: ${JWT_AUDIENCE:-glxt-users}
      JwtSettings__ExpireMinutes: ${JWT_EXPIRE_MINUTES:-60}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: glxt-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data: